name: Build NPM package
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'never'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/**'
      - 'dependencies/**'
      - 'binaries/**'
      - 'tools/binaries/**'
      - 'tools/build.sh'
      - 'package.json'
      - 'package-lock.json'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: milaboratory/github-ci/actions/context/init@v4
        with:
          version-canonize: false
          branch-versioning: main
  run:
    needs:
      - init

    uses: milaboratory/github-ci/.github/workflows/node-matrix.yaml@v4
    with:
      app-name: R run environment for Lineage Trees
      app-name-slug: 'runenv-r-lineage-trees'
      notify-telegram: true

      # binaries/ holds the tree-building programs, in Git LFS.
      checkout-lfs: 'true'

      node-version: '22.x'
      always-auth: 'true'


      matrix: |
        [
          {"os":"windows-latest", "arch":"amd64"},
          {"os":"macos-14",       "arch":"arm64"},
          {"os":"macos-15-large", "arch":"amd64"},
          {"os":"ubuntu-large-arm64", "arch":"arm64"},
          {"os":"ubuntu-large-amd64", "arch":"amd64"}
        ]

      build-artifacts: |
        dist/

      # On Windows these are signed with Azure Trusted Signing (github-ci windows-sign).
      # The Windows rdist holds only PE files in bin/ (R and Rscript have no .exe), hence
      # rdist/windows-x64/bin/*. after-prebuild repacks the archives, so the signatures
      # reach the published package. windows-sign takes the whole list in one step
      # (github-ci#216), so every matched file is signed, not only the first.
      sign-binaries: |
        rdist/**/*.so
        rdist/**/*.dylib
        rdist/**/bin/exec/R
        rdist/**/Rscript
        rdist/**/library/**/bin/*
        rdist/windows-x64/bin/*

      # R writes .so files at run time and signs none of them, not even ad hoc, so library
      # validation is disabled to keep R working on macOS.
      mac-sign-entitlements: |
        <key>com.apple.security.automation.apple-events</key>               <true/>
        <key>com.apple.security.cs.allow-dyld-environment-variables</key>   <true/>
        <key>com.apple.security.cs.allow-jit</key>                          <true/>
        <key>com.apple.security.cs.disable-library-validation</key>         <true/>
        <key>com.apple.security.get-task-allow</key>                        <true/>

      # rdist/<platform>/<R root>, not '**': each platform goes to notarization as one archive,
      # not one request per file.
      notarize-paths: |
        rdist/*/*
        !rdist/*/packages
        !rdist/*/renv-root

      build-script-name: 'build'

      test: false
      test-script-name: 'test'

      aws-login-enable: true

      publish-to-public: true
      registry-url: "https://registry.npmjs.org/"
      npmrc-config: |
        {
          "registries": {
            "https://registry.npmjs.org/": {
              "scopes": ["platforma-open"],
              "tokenVar": "NPMJS_TOKEN"
            }
          }
        }

      ccache-options: |
        hash_dir=false
        max_size=10G
        sloppiness=include_file_ctime,include_file_mtime

    secrets:
      env: |
        { "PL_REGISTRY_PLATFORMA_OPEN_UPLOAD_URL": ${{ toJSON(secrets.PL_REGISTRY_PLOPEN_UPLOAD_URL) }},
          "NPMJS_TOKEN": ${{ toJSON(secrets.NPMJS_TOKEN) }} }

      MAC_SIGN_CERT_ID: '5MJ3ML3YR9'
      MAC_SIGN_CERT: ${{ secrets.MAC_CERTS }}
      MAC_SIGN_CERT_PWD: ${{ secrets.MAC_CERTS_PASSWORD }}
      MAC_NOTR_API_KEY: ${{ secrets.MAC_API_KEY }}
      MAC_NOTR_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
      MAC_NOTR_API_KEY_ISSUER_ID: ${{ secrets.MAC_API_KEY_ISSUER_ID }}

      AWS_ASSUME_ROLE: ${{ secrets.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
      AWS_ASSUME_REGION: 'eu-central-1'

      TELEGRAM_NOTIFICATION_TARGET: ${{ secrets.TG_CHANNEL_MIBUILDS }}
      TELEGRAM_API_TOKEN: ${{ secrets.TG_CI_BOT_TOKEN }}

