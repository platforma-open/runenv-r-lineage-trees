name: Build NPM package
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'never'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/**'
      - 'dependencies/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: milaboratory/github-ci/actions/context/init@v4
        with:
          version-canonize: false
          branch-versioning: main
  run:
    needs:
      - init

    uses: milaboratory/github-ci/.github/workflows/node-matrix.yaml@v4
    with:
      app-name: R run environment for TCR Discovery
      app-name-slug: 'runenv-r-tcr-disco'
      notify-telegram: true

      node-version: '20.x'
      always-auth: 'true'


      matrix: |
        [
          {"os":"windows-latest", "arch":"amd64"},
          {"os":"macos-14",       "arch":"arm64"},
          {"os":"macos-13",       "arch":"amd64"},
          {"os":"rockylinux8-arm64",   "arch":"arm64"},
          {"os":"rockylinux8-amd64",   "arch":"amd64"}
        ]

      build-artifacts: |
        dist/

      sign-binaries: |
        rdist/**/*.so
        rdist/**/*.dylib
        rdist/**/bin/exec/R
        rdist/**/Rscript
        rdist/**/library/**/bin/*

      # R regularly produce new .so files during execution and does not sign them even with ad-hoc signatures,
      # as it is not adjusted for Mac OS X execution environment.
      # We have to disable libraries validation to not break R runtime.
      mac-sign-entitlements: |
        <key>com.apple.security.automation.apple-events</key>               <true/>
        <key>com.apple.security.cs.allow-dyld-environment-variables</key>   <true/>
        <key>com.apple.security.cs.allow-jit</key>                          <true/>
        <key>com.apple.security.cs.disable-library-validation</key>         <true/>
        <key>com.apple.security.get-task-allow</key>                        <true/>

      # rdist/macosx-x64/<R package root>
      # We do not use '**' here, as we do not want to match each file and send it in a separate notarization command.
      # The thing we need is to bundle all files for specific os/arch into one archive and sent it to notarization.
      notarize-paths: |
        rdist/*/*
        !rdist/*/packages
        !rdist/*/renv-root

      build-script-name: 'build'

      test: false
      test-script-name: 'test'

      aws-login-enable: true
      gcp-login-enable: true

      publish-to-public: true
      registry-url: "https://registry.npmjs.org/"
      npmrc-config: |
        {
          "registries": {
            "https://registry.npmjs.org/": {
              "scopes": ["platforma-open"],
              "tokenVar": "NPMJS_TOKEN"
            }
          }
        }

      ccache-options: |
        hash_dir=false
        max_size=10G
        sloppiness=include_file_ctime,include_file_mtime

    secrets:
      env: |
        { "PL_REGISTRY_PLATFORMA_OPEN_UPLOAD_URL": ${{ toJSON(secrets.PL_REGISTRY_PLOPEN_UPLOAD_URL) }},
          "NPMJS_TOKEN": ${{ toJSON(secrets.NPMJS_TOKEN) }} }

      MAC_SIGN_CERT_ID: '5MJ3ML3YR9'
      MAC_SIGN_CERT: ${{ secrets.MAC_CERTS }}
      MAC_SIGN_CERT_PWD: ${{ secrets.MAC_CERTS_PASSWORD }}
      MAC_NOTR_API_KEY: ${{ secrets.MAC_API_KEY }}
      MAC_NOTR_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
      MAC_NOTR_API_KEY_ISSUER_ID: ${{ secrets.MAC_API_KEY_ISSUER_ID }}
      WIN_SIGN_CERT: ${{ secrets.WIN_CODE_SIGN_CHAIN }}

      AWS_ASSUME_ROLE: ${{ secrets.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
      AWS_ASSUME_REGION: 'eu-central-1'

      GCP_KMS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_KMS_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_KMS_SERVICE_ACCOUNT: ${{ secrets.GCP_KMS_SERVICE_ACCOUNT }}
      GCP_KMS_LOCATION: ${{ secrets.GCP_KMS_LOCATION }}
      GCP_KMS_KEYRING: ${{ secrets.GCP_KMS_KEYRING }}
      GCP_KMS_KEY_NAME: ${{ secrets.GCP_KMS_KEY_NAME }}

      TELEGRAM_NOTIFICATION_TARGET: ${{ secrets.TG_CHANNEL_MIBUILDS }}
      TELEGRAM_API_TOKEN: ${{ secrets.TG_CI_BOT_TOKEN }}

